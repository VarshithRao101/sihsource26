<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Processing Graph — Dam Break Simulation</title>
<!--
  modules/05_frontend/workflow.html - the processing graph.

  What this page is FOR: standing in front of a teammate or a juror and
  answering "what does this thing actually do?" in one screen. Boxes are the
  stages, arrows are the data between them, and pressing PLAY runs the real
  pipeline behind them - POST /api/runs, then the WebSocket drives every box
  from WAITING to RUNNING to COMPLETE with the backend's own words in it.

  It also shows the half nobody can see: each box carries the libraries,
  datasets, services and external engines that stage genuinely depends on,
  read off the imports and endpoints in the code it names.

  Rules it keeps, from AGENTS.md:
    - No CDN, no build step, no runtime dependency of any kind.
    - No number appears here that the API did not send.
    - Delft3D is drawn from a filesystem probe. It never turns green and its
      numbers are never borrowed from another engine.

  The graph itself is defined in modules/04_backend/pipeline.py and served by
  /api/pipeline, so this picture cannot drift away from the code.
-->
<style>
  :root {
    /* White ground, black ink. Every colour below is checked against the
       white background rather than against the dark one it replaced: the
       state colours in particular were chosen to glow on near-black and
       several of them (the amber, the green) were unreadable the moment the
       ground turned white. */
    --bg:#ffffff; --bg2:#f6f8fa; --panel:#ffffff; --panel2:#f1f4f8;
    --line:#c6cfd9; --line2:#8d99a8;
    --ink:#0b0f14;                       /* the black. Boxes and wires use it. */
    --fg:#0b0f14; --muted:#48545f; --dim:#6a7480;
    --accent:#0b4fd0;
    --wait:#7d8896; --run:#a35a00; --ok:#0d6b3c; --bad:#a4161a;
    --skip:#5b21b6; --absent:#8d99a8;

    /* Category rails. Darkened from the originals so a 4 px bar on white is
       a colour and not a pastel smear. */
    --k-input:#475569;   --k-data:#4338ca;    --k-geodata:#0f766e;
    --k-physics:#a35a00; --k-solver:#1d4ed8;  --k-output:#0369a1;
    --k-ml:#7e22ce;      --k-engine:#52606d;  --k-validation:#0e7490;
    --k-gate:#15803d;    --k-result:#a16207;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--fg); overflow:hidden;
    height:100vh; display:flex; flex-direction:column;
    font:13px/1.5 system-ui,-apple-system,"Segoe UI",Inter,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header,#banner,.toolbar,#strip { flex:none; }
  a { color:var(--accent); }

  /* ---------------------------------------------------------- chrome */
  header {
    display:flex; align-items:center; gap:16px; padding:11px 18px;
    background:var(--bg);
    border-bottom:2px solid var(--ink); flex-wrap:wrap;
  }
  header h1 {
    font-size:14.5px; margin:0; font-weight:650; letter-spacing:-.01em;
    display:flex; align-items:center; gap:9px;
  }
  header h1 .mark {
    width:9px; height:9px; border-radius:3px;
    background:var(--ink);
    box-shadow:none;
  }
  .nav { display:flex; gap:3px; margin-left:4px; }
  .nav a {
    padding:5px 13px; border-radius:7px; text-decoration:none; font-size:12.5px;
    color:var(--muted); border:1px solid transparent; transition:.15s;
  }
  .nav a:hover { color:var(--fg); background:var(--panel2); }
  .nav a.on { background:var(--panel2); color:var(--fg); border-color:var(--line2); }
  .grow { flex:1; }
  .chip {
    font-size:11px; padding:3px 10px; border-radius:20px; border:1px solid var(--line);
    color:var(--muted); background:var(--panel); white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .chip.live { border-color:var(--run); color:var(--run); background:#fff4e6; }
  .chip.done { border-color:var(--ok); color:var(--ok); background:#e8f6ee; }
  .chip.bad  { border-color:var(--bad); color:var(--bad); background:#fdecea; }

  /* -------------------------------------------------------- toolbar */
  .toolbar {
    display:flex; align-items:flex-end; gap:11px; padding:11px 18px;
    background:var(--bg2); border-bottom:1px solid var(--line); flex-wrap:wrap;
  }
  .fld { display:flex; flex-direction:column; gap:4px; }
  .fld label { font-size:9.5px; text-transform:uppercase; letter-spacing:.09em;
               color:var(--dim); font-weight:600; }
  select,input,button { font:inherit; }
  select,input {
    background:var(--panel); color:var(--fg); border:1px solid var(--line);
    border-radius:7px; padding:7px 10px; min-width:110px; transition:.15s;
  }
  select:hover,input:hover { border-color:var(--line2); }
  select:focus,input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px #0b4fd033; }
  .btn {
    display:inline-flex; align-items:center; gap:7px; padding:8px 17px;
    border-radius:8px; border:1px solid var(--line2); background:var(--panel2);
    color:var(--fg); cursor:pointer; font-weight:600; font-size:13px; transition:.15s;
  }
  .btn:hover:not(:disabled) { border-color:var(--accent); background:var(--panel2); }
  .btn:disabled { opacity:.32; cursor:not-allowed; }
  .btn.play  { background:var(--ok);  border-color:var(--ok);  color:#fff; }
  .btn.play:hover:not(:disabled)  { background:#0a5730; border-color:#0a5730; }
  .btn.pause { background:var(--run); border-color:var(--run); color:#fff; }
  .btn.pause:hover:not(:disabled) { background:#874a00; border-color:#874a00; }
  .btn.reset { background:var(--bad); border-color:var(--bad); color:#fff; }
  .btn.reset:hover:not(:disabled) { background:#851214; border-color:#851214; }

  /* ------------------------------------------------- live metrics */
  #strip {
    display:none; gap:9px; padding:9px 18px; background:var(--bg2);
    border-bottom:1px solid var(--line); overflow-x:auto;
  }
  #strip.on { display:flex; }
  .metric {
    background:var(--panel); border:1.5px solid var(--ink); border-radius:9px;
    padding:7px 13px; min-width:104px; flex:none;
  }
  .metric .k { font-size:9px; text-transform:uppercase; letter-spacing:.09em; color:var(--dim);
               font-weight:650; }
  .metric .v { font-size:17px; font-weight:650; font-variant-numeric:tabular-nums;
               letter-spacing:-.02em; margin-top:1px; }
  .metric .u { font-size:10.5px; color:var(--muted); font-weight:400; }
  .metric.hi { border-color:var(--accent); background:#eef4ff; }

  /* ---------------------------------------------------------- graph */
  .stage { position:relative; flex:1; min-height:0; }
  .stageHead {
    position:absolute; top:0; left:0; right:0; z-index:6; display:flex; gap:14px;
    align-items:center; padding:9px 16px;
    background:linear-gradient(#ffffffee,#ffffff00); pointer-events:none;
  }
  .stageHead .t { font-size:10.5px; text-transform:uppercase; letter-spacing:.1em;
                  color:var(--ink); font-weight:700; white-space:nowrap; }
  .legend { display:flex; gap:13px; flex-wrap:wrap; font-size:10.5px; color:var(--dim); }
  .legend b { color:var(--muted); font-weight:500; }
  .legend i { display:inline-block; width:8px; height:8px; border-radius:2.5px; margin-right:5px; }
  .stageHead .tools { pointer-events:auto; margin-left:auto; display:flex; gap:6px; }
  .mini {
    background:var(--panel); border:1px solid var(--line); color:var(--muted);
    border-radius:7px; padding:4px 10px; cursor:pointer; font-size:11.5px;
    text-transform:none; letter-spacing:0; transition:.15s;
  }
  .mini:hover { color:var(--fg); border-color:var(--ink); background:var(--panel2); }

  #canvasWrap {
    position:absolute; inset:0; overflow:hidden; cursor:grab;
    background:
      radial-gradient(circle at 1px 1px,#c9d3de 1.2px,transparent 0) 0 0/30px 30px,
      var(--bg);
  }
  #canvasWrap.drag { cursor:grabbing; }
  #world { position:absolute; top:0; left:0; transform-origin:0 0; }
  #wires { position:absolute; top:0; left:0; overflow:visible; pointer-events:none; }

  /* Fixed height on purpose: the wires are drawn to the middle of a box, so a
     card that grew with its text would leave its arrows pointing at nothing. */
  .node {
    position:absolute; width:214px; height:112px; overflow:hidden;
    background:var(--panel);
    color:var(--fg); border:2.5px solid var(--ink); border-radius:11px;
    /* The bottom padding reserves the dependency row, which is absolutely
       positioned down there and must never be covered by the detail text. */
    padding:11px 13px 24px; cursor:pointer;
    box-shadow:0 2px 0 #0b0f1414;
    transition:border-color .18s, box-shadow .18s, transform .18s;
  }
  .node::before {
    content:""; position:absolute; left:0; top:0; bottom:0; width:7px;
    background:var(--kc,var(--wait)); border-radius:10px 0 0 10px;
  }
  .node:hover { transform:translateY(-3px); box-shadow:0 8px 20px #0b0f1426; }
  .node .nt { font-size:14px; font-weight:650; line-height:1.25; letter-spacing:-.01em; }
  .node .ns { font-size:11.5px; color:var(--muted); margin-top:2px; }
  .node .nstat {
    margin-top:8px; display:flex; align-items:center; gap:6px;
    font-size:10px; text-transform:uppercase; letter-spacing:.09em; font-weight:700;
  }
  .node .dot { width:7px; height:7px; border-radius:50%; background:var(--wait); flex:none; }
  .node .ndet { font-size:11.5px; color:var(--muted); margin-top:5px; line-height:1.35;
                display:none; word-break:break-word; }
  .node.has-det .ndet { display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical;
                        overflow:hidden; }
  /* Dependency counts. The point of the page is that these are not hidden. */
  .node .deps {
    position:absolute; left:13px; right:11px; bottom:9px; display:flex; gap:5px;
    font-size:9.5px; color:var(--dim); letter-spacing:.02em;
  }
  .node .deps span {
    background:var(--panel2); border:1px solid var(--line); border-radius:5px;
    padding:1px 6px; white-space:nowrap;
  }
  .node .deps span.eng { border-color:var(--bad); color:var(--bad); background:#fdecea; }

  .node[data-s=waiting]  { border-color:var(--ink); }
  .node[data-s=waiting] .nstat { color:var(--dim); }
  .node[data-s=running]  {
    border-color:var(--run); border-width:4px; background:#fff6e8;
    box-shadow:0 0 0 4px #a35a0022;
  }
  .node[data-s=running] .dot { background:var(--run); animation:pulse 1s infinite; }
  .node[data-s=running] .nstat { color:var(--run); }
  .node[data-s=complete] { border-color:var(--ok); border-width:3.5px; background:#eef9f2; }
  .node[data-s=complete] .dot { background:var(--ok); }
  .node[data-s=complete] .nstat { color:var(--ok); }
  .node[data-s=failed]   { border-color:var(--bad); border-width:4px; background:#fdeceb; }
  .node[data-s=failed] .dot { background:var(--bad); }
  .node[data-s=failed] .nstat { color:var(--bad); }
  .node[data-s=skipped] .dot { background:var(--skip); }
  .node[data-s=skipped] .nstat { color:var(--skip); }
  .node[data-s=absent]   { border-style:dashed; border-color:var(--absent);
                         background:repeating-linear-gradient(45deg,#f4f6f9 0 7px,#eaeef3 7px 14px); }
  .node[data-s=absent] .dot { background:var(--absent); }
  .node[data-s=absent] .nstat { color:var(--absent); }
  .node.sel { border-color:var(--accent); box-shadow:0 0 0 4px #0b4fd033; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }

  .node .bar { position:absolute; left:0; right:0; bottom:0; height:4px; background:#0b0f1418;
               overflow:hidden; display:none; }
  .node.showbar .bar { display:block; }
  .node .bar i { display:block; height:100%; width:0; transition:width .25s;
                 background:var(--run); }

  .wire { fill:none; stroke:var(--ink); stroke-width:2.6; }
  .wire.dashed { stroke-dasharray:5 6; stroke:var(--line2); }
  .wire.hot { stroke:var(--run); stroke-width:2.6; stroke-dasharray:8 7;
              animation:flow .6s linear infinite; }
  .wire.done { stroke:var(--ok); stroke-width:2.4; }
  @keyframes flow { to { stroke-dashoffset:-30; } }
  .wlab { fill:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.07em;
          font-weight:600; }
  .warrow { fill:var(--ink); }
  .warrow.done { fill:var(--ok); }
  .warrow.hot { fill:var(--run); }

  /* -------------------------------------------------------- inspector */
  #drawer {
    position:fixed; right:0; top:0; bottom:0; width:440px; max-width:94vw; z-index:40;
    background:var(--bg);
    border-left:2px solid var(--ink); overflow:auto;
    transform:translateX(102%); transition:transform .24s cubic-bezier(.4,0,.2,1);
    padding:18px 22px 48px;
  }
  #drawer.open { transform:none; box-shadow:-16px 0 44px #0b0f1424; }
  #drawer h2 { margin:0 0 3px; font-size:19px; letter-spacing:-.02em; }
  #drawer .sub { color:var(--muted); font-size:12.5px; margin-bottom:13px; }
  #drawer h3 { font-size:9.5px; text-transform:uppercase; letter-spacing:.11em;
               color:var(--dim); margin:19px 0 7px; font-weight:700; }
  #drawer p { margin:0; font-size:13px; line-height:1.65; color:var(--fg); }
  #drawer ul { margin:0; padding-left:18px; font-size:12.5px; line-height:1.65; color:var(--fg); }
  #drawer ul.plain { list-style:none; padding-left:0; }
  #drawer ul.plain li {
    padding:5px 9px; margin-bottom:4px; background:var(--panel2); border:1px solid var(--line);
    border-left:2px solid var(--dl,var(--line2)); border-radius:6px; font-size:12px;
  }
  #drawer code { background:var(--panel2); border:1px solid var(--line); padding:2px 6px;
                 border-radius:5px; font-size:11.5px; color:var(--accent);
                 word-break:break-all; }
  .close { position:absolute; right:14px; top:14px; }
  .badge { display:inline-block; font-size:10px; font-weight:700; letter-spacing:.08em;
           text-transform:uppercase; padding:3px 10px; border-radius:20px; }
  .b-waiting{background:#e8ecf1;color:#3f4a56} .b-running{background:var(--run);color:#fff}
  .b-complete{background:var(--ok);color:#fff}   .b-failed{background:var(--bad);color:#fff}
  .b-skipped{background:var(--skip);color:#fff}  .b-absent{background:#e8ecf1;color:#6a7480}
  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:12.5px; }
  .kv dt { color:var(--muted); } .kv dd { margin:0; font-variant-numeric:tabular-nums; }
  table { border-collapse:collapse; width:100%; font-size:12px; }
  th,td { text-align:left; padding:5px 7px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-size:9.5px; text-transform:uppercase; font-weight:700;
       letter-spacing:.08em; }
  td.num,th.num { text-align:right; font-variant-numeric:tabular-nums; }

  /* ------------------------------------------------------------ misc */
  #tip {
    position:fixed; z-index:60; max-width:340px;
    background:var(--bg); color:var(--fg); border:2px solid var(--ink);
    border-radius:9px; padding:11px 13px; font-size:12px; line-height:1.55;
    pointer-events:none; display:none; box-shadow:0 10px 28px #0b0f1433;
  }
  #tip b { display:block; margin-bottom:4px; font-size:13px; }
  #tip .t2 { color:var(--muted); }
  #tip .t3 { margin-top:7px; color:var(--accent); }
  #tip .t4 { margin-top:7px; color:var(--dim); font-size:11px; }
  #banner {
    display:none; padding:9px 18px; background:#fff4e6;
    color:var(--run); font-weight:700; font-size:12px;
    border-bottom:2px solid var(--run);
  }
  #log {
    position:absolute; left:16px; bottom:16px; width:min(480px,44%); max-height:150px;
    overflow:auto; background:var(--ink); border:1.5px solid var(--ink); border-radius:9px;
    padding:9px 11px; font:11px/1.6 ui-monospace,Consolas,monospace; color:#dbe6f2;
    z-index:6; box-shadow:0 6px 18px #0b0f1433;
  }
  #log .t { color:var(--dim); }
  #log .ok { color:#7ee2a8; } #log .warn { color:#ffd27a; } #log .err { color:#ffa8ae; }
  #log .t { color:#8d99a8; }
  #log::-webkit-scrollbar { width:7px; }
  #log::-webkit-scrollbar-thumb { background:#4a5563; border-radius:4px; }
  #drawer::-webkit-scrollbar { width:9px; }
  #drawer::-webkit-scrollbar-thumb { background:var(--line2); border-radius:5px; }
</style>
<!-- The design layer, owned by the two designers. Loaded last so their
     rules win without anyone editing this file. See theme.css. -->
<link rel="stylesheet" href="/theme.css">
</head>
<body>

<header>
  <h1><span class="mark"></span>Dam Break Inundation — Processing Graph</h1>
  <nav class="nav">
    <a href="/">Console</a>
    <a href="/workflow" class="on">Workflow</a>
  </nav>
  <span class="grow"></span>
  <span class="chip" id="cHealth">connecting…</span>
  <span class="chip" id="cRun">no run</span>
  <span class="chip" id="cStatus">idle</span>
</header>

<div id="banner">SYNTHETIC DATA — this run is not real and must not be shown as a result</div>

<div class="toolbar">
  <div class="fld">
    <label for="fstate">State</label>
    <select id="fstate"><option value="">— any —</option></select>
  </div>
  <div class="fld">
    <label for="fdam">Dam <span id="damcount" style="text-transform:none;letter-spacing:0"></span></label>
    <select id="fdam" style="min-width:300px"><option value="">— pick a dam —</option></select>
  </div>
  <div class="fld">
    <label for="mode">Scenario</label>
    <!-- Filled from GET /api/enums. Deliberately empty in the markup: a
         hardcoded list here was a second copy of shared/contract.py's, and it
         was still offering four cases after the backend grew to eight. -->
    <select id="mode"></select>
  </div>
  <div class="fld" id="fldLevel">
    <label for="level">Reservoir full</label>
    <select id="level">
      <option value="100">100 %</option><option value="75">75 %</option>
      <option value="50">50 %</option><option value="25">25 %</option>
    </select>
  </div>
  <div class="fld" id="fldGate" style="display:none">
    <label for="gate">Gates open</label>
    <select id="gate">
      <option value="100">100 %</option><option value="50">50 %</option>
      <option value="25">25 %</option>
    </select>
  </div>
  <div class="fld" id="fldBlock" style="display:none">
    <label for="blockh">Debris height (m)</label>
    <input id="blockh" type="number" value="40" min="5" max="200" step="5" style="min-width:100px">
  </div>
  <div class="fld">
    <label for="reach">Downstream (km)</label>
    <input id="reach" type="number" value="40" min="5" max="300" step="5" style="min-width:96px">
  </div>
  <div class="fld">
    <label for="endhr">Simulate (hr)</label>
    <input id="endhr" type="number" value="8" min="1" max="72" step="1" style="min-width:88px">
  </div>
  <span class="grow"></span>
  <!-- Stored runs. Five dams and the five rivers the problem statement names,
       from data/demo_runs.json. The source select is not cosmetic: a dam and a
       river are two different questions and the manifest keeps them apart, so
       picking Rivers here can never hand back a dam. -->
  <div class="fld">
    <label for="storedsrc">Stored</label>
    <select id="storedsrc">
      <option value="dam">Dams</option>
      <option value="river">Rivers</option>
    </select>
  </div>
  <div class="fld">
    <label for="storedcase">Case
      <span id="storedcount" style="text-transform:none;letter-spacing:0"></span></label>
    <select id="storedcase" style="min-width:270px"><option value="">loading…</option></select>
  </div>
  <button class="btn play"  id="bPlay">&#9654;&nbsp; PLAY</button>
  <button class="btn pause" id="bPause" disabled>&#10073;&#10073;&nbsp; PAUSE</button>
  <button class="btn reset" id="bReset">&#8635;&nbsp; RESET</button>
  <button class="btn"       id="bStored">&#9199;&nbsp; Load stored run</button>
  <button class="btn"       id="bLast">Replay last run</button>
</div>

<div id="strip"></div>

<div class="stage">
  <div class="stageHead">
    <span class="t">Processing graph</span>
    <span class="legend" id="legend"></span>
    <span class="tools">
      <button class="mini" id="bFit">Fit</button>
      <button class="mini" id="bZin">Zoom +</button>
      <button class="mini" id="bZout">Zoom &minus;</button>
      <button class="mini" id="bOne">100 %</button>
    </span>
  </div>
  <div id="canvasWrap">
    <div id="world"><svg id="wires"></svg></div>
  </div>
  <div id="log"></div>
</div>

<div id="drawer"><button class="mini close" id="bClose">close</button><div id="dbody"></div></div>
<div id="tip"></div>

<script src="/config.js"></script>
<script>
"use strict";

// Same origin when served by uvicorn; a full URL when the pages are
// hosted apart from the backend. See config.js.
const API = (window.SIH_API_BASE || "");

/* ======================================================================
   State
   ====================================================================== */

const S = {
  manifest: null,
  nodeById: {},
  nodeEl: {},
  states: {},           // node id -> {status, detail, note}
  runId: null,
  ws: null,
  mode: "idle",         // idle | running | paused | done | failed
  meta: null,
  impact: null,
  evac: null,
  live: {},             // last streamed solver frame
  dams: [],
  lastStage: null,
  selected: null,
  t0: 0,
};

const $ = id => document.getElementById(id);
const fmt = (v, d = 2) =>
  (v === null || v === undefined || Number.isNaN(v))
    ? "—" : Number(v).toLocaleString(undefined, { maximumFractionDigits: d });

function log(msg, cls) {
  const el = $("log");
  const now = new Date().toLocaleTimeString();
  el.innerHTML +=
    `<div><span class="t">${now}</span>  <span class="${cls || ""}">${escapeHtml(String(msg))}</span></div>`;
  el.scrollTop = el.scrollHeight;
}
function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
}
async function jget(u) {
  const r = await fetch(API + u);
  if (!r.ok) throw new Error(u + " -> " + r.status);
  return r.json();
}
function chip(id, text, cls) {
  const el = $(id);
  el.textContent = text;
  el.className = "chip" + (cls ? " " + cls : "");
}

/* ======================================================================
   Graph — layout, wires, node cards
   ====================================================================== */

const COL = 268, ROW = 148, NW = 214, NH = 112;
const view = { x: 30, y: 46, k: 0.8 };

const KIND_COLOUR = {
  input:"--k-input", data:"--k-data", geodata:"--k-geodata", physics:"--k-physics",
  solver:"--k-solver", output:"--k-output", ml:"--k-ml", engine:"--k-engine",
  validation:"--k-validation", gate:"--k-gate", result:"--k-result",
};

function nodePos(n) { return { x: n.x * COL, y: n.y * ROW }; }

/** The dependency counts printed on a card. The full list is in the drawer. */
function depChips(n) {
  const d = n.deps || {};
  const bits = [];
  if ((d.code || []).length) bits.push(`<span>${d.code.length} lib</span>`);
  if ((d.data || []).length) bits.push(`<span>${d.data.length} data</span>`);
  if ((d.services || []).length) bits.push(`<span>${d.services.length} svc</span>`);
  if ((d.engines || []).length) bits.push(`<span class="eng">${d.engines.length} engine</span>`);
  return bits.join("");
}

function buildGraph() {
  const world = $("world"), svg = $("wires");
  [...world.querySelectorAll(".node")].forEach(e => e.remove());
  svg.innerHTML = "";
  S.nodeEl = {};

  let maxX = 0, maxY = 0;
  for (const n of S.manifest.nodes) {
    const p = nodePos(n);
    maxX = Math.max(maxX, p.x + NW); maxY = Math.max(maxY, p.y + NH);

    const el = document.createElement("div");
    el.className = "node";
    el.dataset.s = "waiting";
    el.dataset.id = n.id;
    el.style.left = p.x + "px";
    el.style.top = p.y + "px";
    el.style.setProperty("--kc", `var(${KIND_COLOUR[n.kind] || "--k-input"})`);
    el.innerHTML =
      `<div class="nt"></div><div class="ns"></div>` +
      `<div class="nstat"><span class="dot"></span><span class="lbl">waiting</span></div>` +
      `<div class="ndet"></div>` +
      `<div class="deps">${depChips(n)}</div>` +
      `<div class="bar"><i></i></div>`;
    el.querySelector(".nt").textContent = n.title;
    el.querySelector(".ns").textContent = n.subtitle;

    el.addEventListener("click", ev => { ev.stopPropagation(); openNode(n.id); });
    el.addEventListener("mouseenter", ev => showTip(ev, n));
    el.addEventListener("mousemove", moveTip);
    el.addEventListener("mouseleave", hideTip);

    world.appendChild(el);
    S.nodeEl[n.id] = el;
    S.nodeById[n.id] = n;
  }

  svg.setAttribute("width", maxX + 80);
  svg.setAttribute("height", maxY + 80);
  for (const e of S.manifest.edges) drawWire(svg, e);
  applyView();
}

function drawWire(svg, e) {
  const a = S.nodeById[e.from], b = S.nodeById[e.to];
  if (!a || !b) return;
  const pa = nodePos(a), pb = nodePos(b);
  const x1 = pa.x + NW, y1 = pa.y + NH / 2;
  const x2 = pb.x,      y2 = pb.y + NH / 2;
  const dx = Math.max(52, (x2 - x1) * 0.55);
  const NS = "http://www.w3.org/2000/svg";

  const path = document.createElementNS(NS, "path");
  path.setAttribute("d", `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`);
  path.setAttribute("class", "wire" + (e.style === "dashed" ? " dashed" : ""));
  path.dataset.from = e.from; path.dataset.to = e.to;
  svg.appendChild(path);

  const head = document.createElementNS(NS, "polygon");
  head.setAttribute("points", `${x2 - 10},${y2 - 5} ${x2 - 10},${y2 + 5} ${x2 - 1},${y2}`);
  head.setAttribute("class", "warrow");
  head.dataset.from = e.from; head.dataset.to = e.to;
  svg.appendChild(head);

  if (e.label) {
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", (x1 + x2) / 2); t.setAttribute("y", (y1 + y2) / 2 - 8);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("class", "wlab");
    t.textContent = e.label;
    svg.appendChild(t);
  }
}

function applyView() {
  $("world").style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
}

/* pan + zoom, the way every node editor works */
(() => {
  const wrap = $("canvasWrap");
  let drag = null;
  wrap.addEventListener("mousedown", e => {
    if (e.target.closest(".node")) return;
    drag = { x: e.clientX - view.x, y: e.clientY - view.y };
    wrap.classList.add("drag");
  });
  addEventListener("mousemove", e => {
    if (!drag) return;
    view.x = e.clientX - drag.x; view.y = e.clientY - drag.y; applyView();
  });
  addEventListener("mouseup", () => { drag = null; wrap.classList.remove("drag"); });
  wrap.addEventListener("wheel", e => {
    e.preventDefault();
    const r = wrap.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const k2 = Math.min(2.2, Math.max(0.26, view.k * (e.deltaY < 0 ? 1.12 : 0.89)));
    view.x = mx - (mx - view.x) * (k2 / view.k);
    view.y = my - (my - view.y) * (k2 / view.k);
    view.k = k2; applyView();
  }, { passive: false });

  const zoomTo = k2 => {
    const r = wrap.getBoundingClientRect();
    const mx = r.width / 2, my = r.height / 2;
    view.x = mx - (mx - view.x) * (k2 / view.k);
    view.y = my - (my - view.y) * (k2 / view.k);
    view.k = k2; applyView();
  };
  $("bZin").onclick  = () => zoomTo(Math.min(2.2, view.k * 1.18));
  $("bZout").onclick = () => zoomTo(Math.max(0.26, view.k / 1.18));
  $("bOne").onclick  = () => zoomTo(1);
  $("bFit").onclick  = fitGraph;
})();

function graphExtent() {
  let maxX = 0, maxY = 0;
  for (const n of S.manifest.nodes) {
    const p = nodePos(n);
    maxX = Math.max(maxX, p.x + NW); maxY = Math.max(maxY, p.y + NH);
  }
  return { maxX, maxY };
}

function fitGraph() {
  if (!S.manifest) return;
  const wrap = $("canvasWrap").getBoundingClientRect();
  const { maxX, maxY } = graphExtent();
  // Guard the degenerate case: before layout these ratios go to zero or
  // negative and the whole graph collapses to a dot.
  const kx = (wrap.width - 56) / maxX, ky = (wrap.height - 110) / maxY;
  view.k = Math.max(0.3, Math.min(kx > 0 ? kx : 1, ky > 0 ? ky : 1, 1.15));
  view.x = Math.max(24, (wrap.width - maxX * view.k) / 2);
  view.y = Math.max(48, (wrap.height - maxY * view.k) / 2);
  applyView();
}

/* ---------------------------------------------------------- tooltips */
function showTip(ev, n) {
  const st = S.states[n.id] || {};
  const d = n.deps || {};
  const dep = []
    .concat((d.engines || []).map(x => "engine: " + x))
    .concat((d.services || []).slice(0, 2))
    .concat((d.code || []).slice(0, 2));
  $("tip").innerHTML =
    `<b>${escapeHtml(n.title)}</b>` +
    `<div class="t2">${escapeHtml(n.does.slice(0, 200))}${n.does.length > 200 ? "…" : ""}</div>` +
    (st.detail ? `<div class="t3">${escapeHtml(st.detail)}</div>` : "") +
    (dep.length ? `<div class="t4">needs ${escapeHtml(dep.join(" · "))}</div>` : "") +
    `<div class="t4">click to expand</div>`;
  $("tip").style.display = "block";
  moveTip(ev);
}
function moveTip(ev) {
  const t = $("tip");
  t.style.left = Math.min(ev.clientX + 18, innerWidth - 360) + "px";
  t.style.top = Math.min(ev.clientY + 18, innerHeight - t.offsetHeight - 16) + "px";
}
function hideTip() { $("tip").style.display = "none"; }

/* ======================================================================
   Node states
   ====================================================================== */

function resetStates() {
  S.states = {};
  for (const n of S.manifest.nodes) {
    const eng = n.engine ? (S.manifest.engines || {})[n.engine] : null;
    S.states[n.id] = eng
      ? { status: eng.installed ? "skipped" : "absent",
          detail: eng.summary || "", note: n.optional_note || "" }
      : { status: "waiting", detail: "", note: "" };
  }
  paintStates();
}

function paintStates() {
  for (const id in S.nodeEl) {
    const el = S.nodeEl[id];
    const st = S.states[id] || { status: "waiting" };
    el.dataset.s = st.status;
    el.querySelector(".lbl").textContent = st.status;
    el.querySelector(".ndet").textContent = st.detail || "";
    el.classList.toggle("has-det", !!st.detail);
    el.classList.toggle("showbar", id === "solve" && st.status === "running");
    if (id === "solve") {
      const pct = Number(S.live.pct || 0);
      el.querySelector(".bar i").style.width = Math.max(0, Math.min(100, pct)) + "%";
    }
  }
  paintWires();
  if (S.selected) openNode(S.selected, true);
}

function paintWires() {
  for (const p of $("wires").querySelectorAll("[data-from]")) {
    const from = S.states[p.dataset.from] || {}, to = S.states[p.dataset.to] || {};
    const arrow = p.tagName === "polygon";
    const base = arrow ? "warrow" : ("wire" + (p.classList.contains("dashed") ? " dashed" : ""));
    let cls = base;
    if (from.status === "complete" && to.status === "running") cls += " hot";
    else if (from.status === "complete" && to.status === "complete") cls += " done";
    p.setAttribute("class", cls);
  }
}

function applyNodeMap(nodes) {
  if (!nodes) return;
  for (const id in nodes) S.states[id] = Object.assign({}, S.states[id], nodes[id]);
  paintStates();
}

/* ======================================================================
   Inspector drawer
   ====================================================================== */

const DEP_SECTIONS = [
  ["engines", "External engines", "#a4161a"],
  ["services", "Network services and credentials", "#a35a00"],
  ["data", "Datasets and files", "#0f766e"],
  ["code", "Python packages", "#1d4ed8"],
];

function depBlock(n) {
  const d = n.deps || {};
  let h = "";
  for (const [key, title, colour] of DEP_SECTIONS) {
    const list = d[key] || [];
    if (!list.length) continue;
    h += `<h3>${title}</h3><ul class="plain">` +
      list.map(x => `<li style="--dl:${colour}">${escapeHtml(x)}</li>`).join("") + `</ul>`;
  }
  return h || `<h3>Dependencies</h3><p style="color:var(--dim)">The standard library and this
    repository only — this stage pulls in nothing external.</p>`;
}

function openNode(id, keepScroll) {
  const n = S.nodeById[id];
  if (!n) return;
  S.selected = id;
  for (const k in S.nodeEl) S.nodeEl[k].classList.toggle("sel", k === id);

  const st = S.states[id] || { status: "waiting" };
  const scroll = keepScroll ? $("drawer").scrollTop : 0;

  let html =
    `<h2>${escapeHtml(n.title)}</h2>` +
    `<div class="sub">${escapeHtml(n.subtitle)}</div>` +
    `<span class="badge b-${st.status}">${st.status}</span>` +
    (st.detail ? `<p style="margin-top:11px;color:#0b4fd0">${escapeHtml(st.detail)}</p>` : "") +
    (st.note ? `<p style="margin-top:9px;color:var(--muted)">${escapeHtml(st.note)}</p>` : "") +
    `<h3>What this stage does</h3><p>${escapeHtml(n.does)}</p>`;

  if ((n.inputs || []).length)
    html += `<h3>Takes in</h3><ul>${n.inputs.map(x => `<li>${escapeHtml(x)}</li>`).join("")}</ul>`;
  if ((n.outputs || []).length)
    html += `<h3>Puts out</h3><ul>${n.outputs.map(x => `<li>${escapeHtml(x)}</li>`).join("")}</ul>`;

  html += depBlock(n);
  html += `<h3>Code</h3><p><code>${escapeHtml(n.module)}</code></p>`;
  if ((n.sources || []).length)
    html += `<h3>Sources</h3><ul>${n.sources.map(x => `<li>${escapeHtml(x)}</li>`).join("")}</ul>`;

  if (id === "validate" && S.runId)
    html += `<h3>Verdict</h3><p id="valv" style="color:var(--muted)">checking…</p>`;
  if (id === "solve" && S.mode === "running") html += liveSolveBlock();
  if (id === "result") html += resultBlock();
  if (id === "delft3d") html += delftBlock();

  $("dbody").innerHTML = html;
  $("drawer").classList.add("open");
  if (keepScroll) $("drawer").scrollTop = scroll;

  if (id === "validate" && S.runId) {
    jget(`/api/runs/${S.runId}/validate`).then(rep => {
      const el = $("valv");
      if (!el) return;
      el.style.color = rep.ok ? "#0d6b3c" : "#a4161a";
      el.innerHTML =
        (rep.ok ? "PASS — contract clean." : "FAIL — " + escapeHtml(rep.errors.join("; "))) +
        (rep.warnings.length
          ? `<br><span style="color:var(--muted)">${escapeHtml(rep.warnings.join("; "))}</span>` : "");
    }).catch(() => {});
  }
}
$("bClose").onclick = () => { $("drawer").classList.remove("open"); S.selected = null; paintStates(); };

function liveSolveBlock() {
  const L = S.live;
  return `<h3>Live from the solver</h3><dl class="kv">
    <dt>progress</dt><dd>${fmt(L.pct, 1)} %</dd>
    <dt>simulated time</dt><dd>${fmt(L.t_hr, 3)} hr</dd>
    <dt>wet cells</dt><dd>${fmt(L.wet_cells, 0)}</dd>
    <dt>max depth</dt><dd>${fmt(L.max_depth_m, 2)} m</dd>
    <dt>timestep</dt><dd>${fmt(L.dt_s, 3)} s</dd>
    <dt>volume in</dt><dd>${fmt(L.volume_in_mcm, 3)} MCM</dd>
    <dt>volume out</dt><dd>${fmt(L.volume_out_mcm, 3)} MCM</dd>
    <dt>volume stored</dt><dd>${fmt(L.volume_stored_mcm, 3)} MCM</dd>
  </dl>`;
}

function delftBlock() {
  const e = (S.manifest.engines || {}).delft3d || {};
  const d = e.detail || {};
  let h = `<h3>Engine probe</h3><p>${escapeHtml(e.summary || "not probed")}</p>`;
  if ((d.searched || []).length)
    h += `<h3>Paths searched</h3><ul class="plain">` +
      d.searched.map(x => `<li><code>${escapeHtml(x)}</code></li>`).join("") + `</ul>`;
  if ((d.licence_tooling || []).length)
    h += `<h3>Found, but not a solver</h3><ul class="plain">` +
      d.licence_tooling.map(x => `<li><code>${escapeHtml(x)}</code></li>`).join("") + `</ul>`;
  h += `<p style="margin-top:12px;color:#a4161a">This node cannot turn green while the kernel is
        missing, and no other engine's numbers are shown in its place.</p>`;
  return h;
}

/* The final node carries the answer, read back off the validated run. */
function resultBlock() {
  if (!S.meta) return `<h3>Result</h3><p style="color:var(--muted)">No finished run loaded yet.</p>`;
  const r = S.meta.results || {}, site = S.meta.site || {};
  let h = `<h3>Flood — ${escapeHtml(site.name || "")}</h3><dl class="kv">
    <dt>flooded area</dt><dd>${fmt(r.flood_area_km2)} km²</dd>
    <dt>max depth</dt><dd>${fmt(r.max_depth_m)} m</dd>
    <dt>max velocity</dt><dd>${fmt(r.max_velocity_ms)} m/s</dd>
    <dt>peak discharge</dt><dd>${fmt(r.peak_discharge_cumecs, 0)} m³/s</dd>
    <dt>released volume</dt><dd>${fmt(r.released_volume_mcm, 2)} MCM</dd>
    <dt>mass balance</dt><dd>${fmt(r.mass_balance_err_pct, 4)} %</dd>
    <dt>solver runtime</dt><dd>${fmt(r.runtime_s, 1)} s</dd>
  </dl>`;

  if (S.impact && S.impact.totals) {
    const t = S.impact.totals;
    h += `<h3>Damage and loss</h3><dl class="kv">
      <dt>settlements hit</dt><dd>${fmt(t.settlements_affected, 0)}</dd>
      <dt>people affected</dt><dd>${fmt(t.population_affected, 0)}</dd>
      <dt>houses affected</dt><dd>${fmt(t.houses_affected, 0)}</dd>
      <dt>roads cut</dt><dd>${fmt(t.roads_cut_km)} km</dd>
      <dt>damage</dt><dd>₹ ${fmt(t.damage_inr_crore)} crore</dd>
    </dl>`;
    const ss = (S.impact.settlements || []).slice(0, 12);
    if (ss.length) {
      h += `<h3>Warning time by settlement</h3><table><tr><th>Place</th>
            <th class="num">Arrives</th><th class="num">Depth</th><th>Hazard</th></tr>` +
        ss.map(s => `<tr><td>${escapeHtml(s.name)}</td>
          <td class="num">${fmt(s.arrival_hr)} hr</td>
          <td class="num">${fmt(s.max_depth_m)} m</td>
          <td>${escapeHtml(s.hazard_class || "")}</td></tr>`).join("") + `</table>`;
    }
    if (t.damage_curve_source)
      h += `<p style="margin-top:9px;font-size:11px;color:var(--muted)">${escapeHtml(t.damage_curve_source)}</p>`;
  } else {
    h += `<h3>Damage and loss</h3><p style="color:var(--muted)">No impact.json for this run — it
          needs settlements from OpenStreetMap, so it needs a run on real terrain.</p>`;
  }

  if (S.evac && (S.evac.routes || []).length) {
    h += `<h3>Evacuation</h3><table><tr><th>From</th><th class="num">Walk</th>
          <th class="num">Margin</th></tr>` +
      S.evac.routes.slice(0, 12).map(r2 => `<tr>
        <td>${escapeHtml(r2.settlement || r2.name || "")}</td>
        <td class="num">${fmt(r2.walk_time_hr ?? r2.travel_time_hr)} hr</td>
        <td class="num" style="color:${(r2.margin_hr ?? 1) < 0 ? "#a4161a" : "#0d6b3c"}">
          ${fmt(r2.margin_hr)} hr</td></tr>`).join("") + `</table>`;
  } else {
    h += `<h3>Evacuation</h3><p style="color:var(--muted)">No evacuation plan for this run — it
          needs OSM road geometry.</p>`;
  }

  h += `<h3>Export</h3><p>
    <a href="${API}/api/runs/${S.runId}/export?format=kml">KML</a> ·
    <a href="${API}/api/runs/${S.runId}/export?format=shp">Shapefile</a> ·
    <a href="${API}/api/runs/${S.runId}/export?format=geojson">GeoJSON</a></p>
    <p style="margin-top:10px"><a href="/">Open this run on the map &rarr;</a></p>`;
  return h;
}

function metric(k, v, u, hi) {
  return `<div class="metric${hi ? " hi" : ""}"><div class="k">${k}</div>
          <div class="v">${v}<span class="u"> ${u || ""}</span></div></div>`;
}

function stripLive(d) {
  $("strip").className = "on";
  $("strip").innerHTML =
    metric("solver", fmt(d.pct, 1), "%", true) +
    metric("simulated time", fmt(d.t_hr, 2), "hr") +
    metric("max depth", fmt(d.max_depth_m, 2), "m") +

    metric("timestep", fmt(d.dt_s, 3), "s") +
    metric("volume in", fmt(d.volume_in_mcm, 2), "MCM") +

function stripResult() {
  if (!S.meta) { $("strip").className = ""; return; }

}

/* ======================================================================
   The dam picker — only the fields an operator actually fills in
   ====================================================================== */

async function loadStates2() {
  try {
    const r = await jget("/api/dams/states");
    for (const st of r.states) {
      const o = document.createElement("option");
      o.value = st; o.textContent = st; $("fstate").appendChild(o);
    }
  } catch { log("dam catalogue unavailable", "err"); }
}

async function loadDams() {
  const p = new URLSearchParams();
  if ($("fstate").value) p.set("state", $("fstate").value);
  p.set("limit", "400");
  let r;
  try { r = await jget("/api/dams?" + p.toString()); } catch { return; }
  S.dams = r.dams || [];
  $("damcount").textContent = `(${S.dams.length})`;
  const sel = $("fdam");
  sel.innerHTML = "";
  for (const d of S.dams) {
    const o = document.createElement("option");
    o.value = d.id;
    o.textContent = `${d.name} — ${d.river || "?"} — ${d.height_m ?? "?"} m`;
    sel.appendChild(o);
  }
  if (S.dams.length > 0) {
    // Prefer Hirakud or Cheyyeru if present in the initial batch, else first dam
    const preferred = S.dams.find(d => d.name.toUpperCase().includes("HIRAKUD") || d.name.toUpperCase().includes("CHEYYERU")) || S.dams[0];
    sel.value = preferred.id;
  }
}

$("fstate").onchange = loadDams;
loadModes();
/* The case list, and which of this page's fields each case reads. Both come
   from the API - `controls` is the same per-mode list the console uses, so a
   case cannot show a field here that the solver ignores. */
async function loadModes() {
  let e;
  try { e = await fetch(API + "/api/enums").then(r => r.json()); }
  catch { log("could not read /api/enums — case list unavailable", "err"); return; }
  MODEINFO = e.failure_mode_info || {};
  const legal = e.dam_failure_modes || e.failure_modes || [];
  $("mode").innerHTML = legal.map(m =>
    `<option value="${m}">${(MODEINFO[m] || {}).label || m}</option>`).join("");
  applyModeFields();
}

let MODEINFO = {};

function applyModeFields() {
  const m = $("mode").value;
  const wants = new Set((MODEINFO[m] || {}).controls || []);
  $("fldLevel").style.display = wants.has("reservoir_level_frac") ? "" : "none";
  $("fldGate").style.display  = wants.has("gate_opening_frac") ? "" : "none";
  $("fldBlock").style.display =
    (wants.has("blockage_height_m") || wants.has("moraine_height_m")) ? "" : "none";
  const lbl = $("fldBlock").querySelector("label");
  if (lbl) {
    lbl.textContent = wants.has("moraine_height_m") ? "Moraine (m)" : "Barrier (m)";
  }
}

$("mode").onchange = applyModeFields;

/* ======================================================================
   PLAY / PAUSE / RESET — these drive the real backend
   ====================================================================== */

$("bPlay").onclick = play;
$("bPause").onclick = togglePause;
$("bReset").onclick = reset;
$("bLast").onclick = replayLast;

async function play() {
  if (S.mode === "running") return;
  let damId = $("fdam").value;
  if (!damId && S.dams.length > 0) {
    damId = S.dams[0].id;
    $("fdam").value = damId;
  }
  if (!damId) { log("pick a dam first — every physical number comes from the register.", "warn"); return; }

  const mode = $("mode").value;
  const body = {
    dam_id: damId,
    failure_mode: mode,
    reservoir_level_frac: +$("level").value / 100,
    reach_length_km: +$("reach").value,
    end_hr: +$("endhr").value,
    real_terrain: true,
  };
  if (mode === "gated_release")   body.gate_opening_frac = +$("gate").value / 100;
  if (mode === "blockage_breach") body.blockage_height_m = +$("blockh").value;
  if (mode === "glof_moraine")    body.moraine_height_m = +$("blockh").value;
  if (mode === "spillway_blockage") {
    // Without an inflow the reservoir never rises and the run is refused. This
    // page has no inflow box, so it states a value rather than posting one the
    // validator will reject - and the log says what it used.
    body.inflow_cumecs = 2000;
    body.residual_spillway_frac = 0.15;
    log("spillway blockage: inflow 2,000 m3/s at 15% residual outlet capacity " +
        "(this page has no inflow field; the console does).");
  }

  resetStates();
  S.meta = S.impact = S.evac = null;
  S.live = {}; S.lastStage = null;
  $("strip").className = "";
  $("log").innerHTML = "";
  log("POST /api/runs …");

  let j;
  try {
    const r = await fetch(API + "/api/runs", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    j = await r.json();
    if (!r.ok) { log("REJECTED: " + JSON.stringify(j), "err"); return; }
  } catch (e) { log("failed to start: " + e.message, "err"); return; }

  S.runId = j.run_id;
  S.mode = "running";
  S.t0 = Date.now();
  chip("cRun", j.run_id);
  chip("cStatus", "running", "live");
  $("bPlay").disabled = true;
  $("bPause").disabled = false;
  $("bPause").innerHTML = "&#10073;&#10073;&nbsp; PAUSE";
  log("run_id " + j.run_id + " — following " + j.websocket, "ok");
  follow(j.run_id);
}

function follow(runId) {
  const ws = new WebSocket(window.SIH_WS(`/ws/runs/${runId}`));
  S.ws = ws;

  /* Every handler checks it is still the run the page cares about. Closing a
     socket fires onclose asynchronously, so without this a RESET is undone a
     moment later by the close handler of the run it just cancelled. */
  const stale = () => S.runId !== runId;

  ws.onmessage = ev => {
    if (stale()) return;
    let d; try { d = JSON.parse(ev.data); } catch { return; }
    S.live = d;
    if (d.nodes) applyNodeMap(d.nodes);
    // The registry keeps `stage` in its state, so every frame carries the last
    // one. Log it only when it changes, or the panel fills with a hundred
    // copies of "solving shallow water".
    if (d.stage && d.stage !== S.lastStage) { S.lastStage = d.stage; log(d.stage); }
    if (d.pct !== undefined && d.t_hr !== undefined) { stripLive(d); paintStates(); }
    if (d.status === "failed") log("FAILED: " + (d.error || ""), "err");
  };
  ws.onerror = () => { if (!stale()) log("websocket dropped — polling instead", "warn"); };
  ws.onclose = async () => {
    if (S.ws === ws) S.ws = null;
    if (stale()) return;
    let st = null;
    try { st = await jget(`/api/runs/${runId}/status`); } catch {}
    if (stale()) return;
    if (st && st.error) { finishRun(runId, "failed", st.error); return; }
    finishRun(runId, "done");
  };
}

async function finishRun(runId, how, err) {
  if (S.runId !== runId) return;
  $("bPlay").disabled = false;
  $("bPause").disabled = true;
  if (how === "failed") {
    S.mode = "failed";
    chip("cStatus", "failed", "bad");
    log("run failed: " + (err || ""), "err");
    return;
  }
  S.mode = "done";
  chip("cStatus", `done in ${((Date.now() - S.t0) / 1000).toFixed(1)}s`, "done");
  log("run complete — loading outputs", "ok");
  await loadRun(runId);
}

async function togglePause() {
  if (!S.runId) return;
  const to = S.mode === "paused" ? "resume" : "pause";
  try {
    const r = await fetch(`${API}/api/runs/${S.runId}/${to}`, { method: "POST" });
    const j = await r.json();
    if (!r.ok) { log("pause failed: " + JSON.stringify(j), "err"); return; }
    S.mode = j.paused ? "paused" : "running";
    $("bPause").innerHTML = j.paused ? "&#9654;&nbsp; RESUME" : "&#10073;&#10073;&nbsp; PAUSE";
    chip("cStatus", j.paused ? "paused" : "running", j.paused ? "" : "live");
    log(j.paused
      ? "solver paused — the solve thread is blocked between timesteps"
      : "solver resumed", "warn");
  } catch (e) { log("pause failed: " + e.message, "err"); }
}

async function reset() {
  /* Disown the run FIRST. Everything below yields, and a WebSocket close
     handler that fires mid-await must find that the page has already moved on -
     otherwise it repopulates the workspace we are in the middle of clearing. */
  const cancelling = S.runId;
  const wasLive = S.mode === "running" || S.mode === "paused";
  S.runId = null; S.mode = "idle"; S.live = {}; S.lastStage = null;

  if (S.ws) { try { S.ws.close(); } catch {} S.ws = null; }
  if (cancelling && wasLive) {
    try {
      await fetch(`${API}/api/runs/${cancelling}/cancel`, { method: "POST" });
      log("cancel sent to the solver — " + cancelling, "warn");
    } catch {}
  }

  S.meta = S.impact = S.evac = null;
  chip("cRun", "no run"); chip("cStatus", "idle");
  $("bPlay").disabled = false;
  $("bPause").disabled = true;
  $("bPause").innerHTML = "&#10073;&#10073;&nbsp; PAUSE";
  $("banner").style.display = "none";
  $("strip").className = "";
  $("drawer").classList.remove("open"); S.selected = null;
  $("log").innerHTML = "";
  REPLAY_TOKEN++;          // abandons a stored-run walk in flight
  $("bStored").disabled = false;
  resetStates();
  log("reset. every box is back to WAITING.");
}

async function replayLast() {
  try {
    const r = await jget("/api/runs");
    const runs = r.runs || [];
    if (!runs.length) { log("no runs on disk yet", "warn"); return; }
    resetStates();
    // A replay did not execute anything now. The boxes report what the run
    // folder on disk ACTUALLY contains - a missing evacuation.json means the
    // stage produced none, and the box says skipped rather than green - and
    // the status chip says replay so nobody reads it as a live solve.
    chip("cStatus", "replay — nothing is solving", "");
    S.mode = "done";
    await loadRun(runs[0].run_id, true);
  } catch (e) { log("replay failed: " + e.message, "err"); }
}

/* ======================================================================
   Loading a finished run
   ====================================================================== */

async function loadRun(runId, markGraph) {
  if (!runId) return;
  S.runId = runId;
  chip("cRun", runId);
  const d = await jget("/api/runs/" + runId);
  S.meta = d.meta;
  S.impact = d.impact || null;
  $("banner").style.display = d.is_fake ? "block" : "none";

  try { S.evac = await jget(`/api/runs/${runId}/evacuation`); } catch { S.evac = null; }

  if (markGraph) markGraphFromRun(d);
  stripResult();
  openNode("result");
  log("loaded " + runId, "ok");
}

/* For a replay, derive each node's state from what the run folder ACTUALLY
   contains. A missing evacuation.json means the stage did not produce one, and
   the box says skipped rather than green. */
function markGraphFromRun(d) {
  const target = statesFromRun(d);
  for (const id in target) S.states[id] = target[id];
  paintStates();
  runValidatorForReplay();
}

/* The same derivation, but returned instead of painted, so the paced replay
   can walk it one stage at a time. Everything here is read off the run folder;
   nothing is assumed and nothing is invented. */
function statesFromRun(d) {
  const out = {};
  const files = d.files || [];
  const has = f => files.includes(f);
  const meta = d.meta || {}, r = meta.results || {};
  const site = meta.site || {}, dem = meta.dem || {};
  const set = (id, status, detail) => { out[id] = { status, detail, note: "" }; };

  set("input", "complete", `${(meta.scenario || {}).failure_mode || ""} at ${site.name || ""}`);
  set("catalogue", "complete",
      `${site.dam_height_m ?? "?"} m, ${site.reservoir_capacity_mcm ?? "?"} MCM, source ${site.source || "?"}`);
  const real = (dem.source || "") !== "SYNTHETIC";
  set("river", real ? "complete" : "skipped",
      real ? `domain traced, ${((meta.domain || {}).reach_length_km ?? "?")} km reach` : "synthetic valley");
  set("terrain", real ? "complete" : "skipped",
      real ? `${dem.source}, ${dem.native_resolution_m ?? "?"} m native` : "synthetic valley");
  set("exposure", S.impact ? "complete" : "skipped",
      S.impact ? `${(S.impact.totals || {}).settlements_affected ?? 0} settlements affected`
               : "no impact.json in this run");
  set("breach", "complete",
      `${(meta.scenario || {}).breach_param_source || "gated release — no breach regression"}`);
  set("solve", "complete",
      `${fmt(r.solver_steps, 0)} steps, mass balance ${fmt(r.mass_balance_err_pct, 4)}%`);
  set("grids", has("packed.png") ? "complete" : "skipped",
      `${(meta.domain || {}).nx}×${(meta.domain || {}).ny} cells at ${fmt((meta.domain || {}).cellsize_m, 0)} m`);
  set("impact", S.impact ? "complete" : "skipped",
      S.impact
        ? `₹ ${fmt((S.impact.totals || {}).damage_inr_crore)} crore, ${fmt((S.impact.totals || {}).population_affected, 0)} people`
        : "no impact.json");
  set("evacuation", S.evac ? "complete" : "skipped",
      S.evac ? `${(S.evac.routes || []).length} routes planned` : "no evacuation.json in this run");
  set("uncertainty", has("uncertainty.json") ? "complete" : "skipped", "regression spread published");
  set("validate", "running", "running the contract validator…");
  set("result", "complete",
      `${fmt(r.flood_area_km2)} km² flooded, max depth ${fmt(r.max_depth_m)} m, peak ${fmt(r.peak_discharge_cumecs, 0)} m³/s`);
  if (has("validation.json")) set("gee", "complete", "Sentinel-1 comparison stored with this run");
  return out;
}

/* The validator is the definition of done, so a replay runs it for real rather
   than assuming the folder passed when it was written. */
function runValidatorForReplay() {
  jget(`/api/runs/${S.runId}/validate`).then(rep => {
    const n = rep.warnings.length;
    S.states.validate = rep.ok
      ? { status: "complete",
          detail: "contract clean" + (n ? `, ${n} warning${n === 1 ? "" : "s"}` : ""), note: "" }
      : { status: "failed", detail: rep.errors.join("; "), note: "" };
    if (!rep.ok) S.states.result = { status: "failed", detail: "run does not validate", note: "" };
    paintStates();
  }).catch(() => {
    S.states.validate = { status: "skipped", detail: "validator did not answer", note: "" };
    paintStates();
  });
}

/* ======================================================================
   Stored runs, walked one stage at a time

   WHAT THIS IS, SAID PLAINLY, BECAUSE IT DECIDES WHETHER IT MAY BE SHOWN.
   A stored run is a real run: contract-valid folders written by
   runner.run_scenario on COP30 terrain, built by
   integration/build_demo_runs.py, and every box below reports what that run
   folder ACTUALLY contains. Nothing is solving while this plays. The reason it
   exists is that Machchhu II took twenty minutes of compute and a panel will
   not watch twenty minutes of spinner - so the solve was done in advance and
   what you are watching is the recorded shape of it.

   The pace is not invented either. Each stage's dwell is proportional to the
   wall-clock seconds that stage genuinely took when the run was built -
   `stage_timings` in data/demo_runs.json, measured off the same progress
   stream the WebSocket carries during a live PLAY - normalised onto a fifteen
   second clock. So the stages that were slow look slow relative to the ones
   that were fast, and the compression factor is printed in the log and on the
   status chip. If a run has no measured timings the pace falls back to an even
   split and SAYS SO rather than pretending the rhythm means something.

   PLAY is still the live solve. This button is not a substitute for it.
   ====================================================================== */

const REPLAY_SECONDS = 15;      // inside the 10-20 s the demo script allows
const REPLAY_FLOOR_S = 0.28;    // no stage flashes past unreadably

/* Execution order, which is NOT the order the nodes are declared in for
   layout. This is the order api._execute and runner.run_scenario actually
   enter them; a node in the manifest but missing here is appended, so adding a
   stage to pipeline.py can never make it silently vanish from a replay. */
const REPLAY_ORDER = [
  "input", "catalogue", "river", "terrain", "exposure", "inflow", "breach",
  "sph", "solve", "surrogate", "grids", "impact", "evacuation", "uncertainty",
  "sfincs", "delft3d", "compare", "gee", "validate", "result",
];

let DEMOS = [];
let REPLAY_TOKEN = 0;

function orderedNodeIds() {
  const known = new Set(S.manifest.nodes.map(n => n.id));
  const out = REPLAY_ORDER.filter(id => known.has(id));
  for (const n of S.manifest.nodes) if (!out.includes(n.id)) out.push(n.id);
  return out;
}

async function loadDemos() {
  try {
    const d = await jget("/api/demo-runs");
    DEMOS = d.runs || [];
  } catch { DEMOS = []; }
  paintDemoList();
}

function demosFor(src) {
  return DEMOS.filter(d => (d.category || "dam") === src);
}

function paintDemoList() {
  const src = $("storedsrc").value;
  const mine = demosFor(src);
  const sel = $("storedcase");
  sel.innerHTML = mine.length
    ? mine.map(d => `<option value="${d.run_id}">${escapeHtml(d.label)}</option>`).join("")
    : `<option value="">none built</option>`;
  $("storedcount").textContent = `(${mine.length})`;
  $("bStored").disabled = mine.length === 0;
  $("bStored").title = mine.length
    ? ""
    : `No stored ${src} runs on disk. Build them with `
      + `python -m integration.build_demo_runs`;
}

function currentDemo() {
  const id = $("storedcase").value;
  return DEMOS.find(d => d.run_id === id) || null;
}

/* Seconds each stage should hold the screen. Proportional to what it measured,
   floored so nothing is invisible, then renormalised so the whole walk lands
   on REPLAY_SECONDS however lopsided the real timings were. */
function dwellPlan(ids, timings) {
  const by = {};
  for (const t of (timings || [])) by[t.node] = Number(t.seconds) || 0;
  const measured = ids.reduce((a, id) => a + (by[id] || 0), 0);
  let dwell = ids.map(id =>
    measured > 0 ? (by[id] || 0) / measured * REPLAY_SECONDS
                 : REPLAY_SECONDS / ids.length);
  dwell = dwell.map(v => Math.max(v, REPLAY_FLOOR_S));
  const sum = dwell.reduce((a, b) => a + b, 0);
  const k = REPLAY_SECONDS / sum;
  return { dwell: dwell.map(v => v * k), measured: measured, by: by };
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

/* One frame, or 30 ms, whichever arrives first.

   setTimeout is NOT a reliable clock here. A browser throttles timers in a tab
   it considers hidden or occluded - and an embedded preview pane frequently is
   one - clamping every call to about a second however small the argument. On
   this machine twenty setTimeout(210) calls took 18.9 s instead of 4.2, which
   walked a fifteen second replay in thirty-one. requestAnimationFrame is tied
   to the compositor and gives ~16 ms while the page is actually being drawn;
   the setTimeout is the backstop for when it is not being drawn at all and
   rAF never fires, in which case the walk degrades to roughly a stage a second
   instead of hanging. */
const tick = () => new Promise(r => {
  let done = false;
  const fin = () => { if (!done) { done = true; r(); } };
  requestAnimationFrame(fin);
  setTimeout(fin, 30);
});

async function playStored() {
  if (S.mode === "running") {
    log("a live solve is in flight - press RESET first", "warn");
    return;
  }
  const demo = currentDemo();
  if (!demo) { log("no stored run selected", "warn"); return; }

  const token = ++REPLAY_TOKEN;
  S.mode = "replay";
  $("bStored").disabled = true;
  resetStates();
  $("strip").classList.remove("on");
  $("log").innerHTML = "";

  log(`stored run - ${demo.label}`, "ok");
  if (demo.why) log(demo.why);

  let d;
  try {
    d = await jget("/api/runs/" + demo.run_id);
  } catch (e) {
    log("could not open the stored run: " + e.message, "err");
    S.mode = "idle"; $("bStored").disabled = false; return;
  }
  if (token !== REPLAY_TOKEN) return;

  S.runId = demo.run_id;
  S.meta = d.meta;
  S.impact = d.impact || null;
  chip("cRun", demo.run_id);
  $("banner").style.display = d.is_fake ? "block" : "none";
  try { S.evac = await jget(`/api/runs/${demo.run_id}/evacuation`); } catch { S.evac = null; }
  if (token !== REPLAY_TOKEN) return;

  const target = statesFromRun(d);
  const ids = orderedNodeIds();
  const plan = dwellPlan(ids, demo.stage_timings);

  if (plan.measured > 0) {
    const speed = plan.measured / REPLAY_SECONDS;
    log(`${plan.measured.toFixed(1)} s of measured pipeline time, replayed over `
        + `${REPLAY_SECONDS} s - ${speed.toFixed(0)}x. Nothing is solving now.`, "warn");
  } else {
    log(`this run has no measured stage timings, so the ${REPLAY_SECONDS} s are `
        + `split evenly - the rhythm below means nothing. Nothing is solving now.`,
        "warn");
  }

  /* Deadlines off one wall clock, not a chain of sleeps. An accumulated
     setTimeout drifts: every await rounds up, every paintStates costs a few
     milliseconds, and the first version of this walked a 15 s plan in 31 s on
     this machine. Against a fixed start the error cannot accumulate - a slow
     paint eats the next stage's slice instead of being added to the total - so
     the walk lands on REPLAY_SECONDS whatever the page is doing. */
  const t0 = performance.now();
  let acc = 0;
  /* Wait until `ms` after the start of the walk. `onTick` is called with the
     elapsed time on the way there, which is how the solver bar fills smoothly
     rather than in twelve visible jumps. */
  const until = async (ms, onTick) => {
    while (performance.now() - t0 < ms - 8) {
      if (token !== REPLAY_TOKEN) return;
      if (onTick) onTick(performance.now() - t0);
      await tick();
    }
    if (onTick) onTick(ms);
  };

  for (let i = 0; i < ids.length; i++) {
    if (token !== REPLAY_TOKEN) return;
    const id = ids[i];
    const node = S.nodeById[id] || {};
    const end = target[id] || S.states[id] || { status: "waiting", detail: "" };
    const slice = plan.dwell[i] * 1000;

    // A stage that did not run in this run is never shown as running. It goes
    // straight to skipped or absent, which is the whole point of those states.
    const ran = end.status === "complete" || end.status === "failed"
             || end.status === "running";
    if (ran) {
      S.states[id] = { status: "running", detail: "", note: "" };
      chip("cStatus",
           `replay ${i + 1}/${ids.length} - ${(node.title || id).toLowerCase()}`, "");
      paintStates();
      // The solver box carries a progress bar during a live run; drive it here
      // too, from the same clock, so the replay reads the same as the real
      // thing rather than jumping from 0 to 100.
      if (id === "solve") {
        // Only the bar is repainted while the solver box fills. A full
        // paintStates costs about 12 ms - fine once per stage, far too much
        // once per frame - and the bar is the only thing changing.
        const bar = (S.nodeEl.solve || {}).querySelector
          ? S.nodeEl.solve.querySelector(".bar i") : null;
        await until(acc + slice, el => {
          const pct = Math.max(0, Math.min(100, (el - acc) / slice * 100));
          S.live.pct = pct;
          if (bar) bar.style.width = pct + "%";
        });
      } else {
        await until(acc + slice);
      }
      if (token !== REPLAY_TOKEN) return;
    }

    acc += slice;
    S.states[id] = end;
    const real = plan.by[id];
    if (ran && end.detail) {
      log(`${node.title || id} - ${end.detail}`
          + (real ? `  [${real.toFixed(2)} s when it was solved]` : ""),
          end.status === "failed" ? "err" : "ok");
    }
    paintStates();
    // A stage that did not run still holds its slot, so the whole walk is one
    // schedule rather than a walk plus a tail of extra pauses.
    if (!ran) await until(acc);
  }

  if (token !== REPLAY_TOKEN) return;
  S.mode = "done";
  chip("cStatus", "stored run - nothing is solving", "");
  runValidatorForReplay();
  stripResult();
  openNode("result");
  $("bStored").disabled = false;
  log("stored run complete. Press PLAY to solve a fresh scenario for real.", "ok");
}

$("storedsrc").onchange = paintDemoList;
$("bStored").onclick = playStored;

/* ======================================================================
   Boot
   ====================================================================== */

function buildLegend() {
  const items = [
    ["waiting", "var(--wait)"], ["running", "var(--run)"], ["complete", "var(--ok)"],
    ["failed", "var(--bad)"], ["skipped", "var(--skip)"], ["absent", "var(--absent)"],
  ];
  $("legend").innerHTML = items
    .map(([k, c]) => `<b><i style="background:${c}"></i>${k}</b>`).join("");
}

(async () => {
  buildLegend();
  try {
    const h = await jget("/health");
    if (h.mode === "readonly") {
      chip("cHealth", "read-only build — cannot solve", "bad");
      $("bPlay").disabled = true;
      $("bPlay").title = h.reason || "";
      $("bPlay").innerHTML = "&#9654;&nbsp; PLAY (unavailable here)";
      log(h.reason || "This build serves stored runs only.", "warn");
      log("Use \"Replay last run\" to walk a run that was solved on a real machine.", "warn");
    } else {
      chip("cHealth", `backend ok · jit ${h.jit_warmup_s ?? "?"}s`, "done");
    }
  } catch { chip("cHealth", "backend unreachable", "bad"); }

  try {
    S.manifest = await jget("/api/pipeline");
  } catch (e) {
    log("could not load the pipeline manifest: " + e.message, "err");
    return;
  }
  buildGraph();
  resetStates();
  fitGraph();

  const eng = S.manifest.engines || {};
  for (const k in eng) log(`${k}: ${eng[k].summary}`, eng[k].installed ? "ok" : "warn");
  log(`${S.manifest.nodes.length} stages, ${S.manifest.edges.length} data flows — pick a dam and press PLAY.`);

  await loadStates2();
  await loadDams();
  await loadDemos();
})();

let fitTimer = null;
addEventListener("resize", () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitGraph, 150); });

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { $("drawer").classList.remove("open"); S.selected = null; paintStates(); }
  if (e.key === "f" && !/input|select/i.test(document.activeElement.tagName)) fitGraph();
});
</script>
</body>
</html>
